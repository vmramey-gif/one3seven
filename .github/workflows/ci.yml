name: CI

# Runs the full test suite — including the copy-guardrail verb test
# (src/services/__tests__/marketingCopyGuardrails.test.ts) — on every push and PR,
# so a banned UPL / outcome / trademark / pricing / metric claim in the marketing
# pages, rep scripts, or the AI prompt cannot ship unnoticed.
#
# NOTE: this makes the check VISIBLE. To make it BLOCKING, enable branch protection
# on `main` and require the "test" check to pass before merge (repo Settings →
# Branches → Branch protection rules). Vercel deploys independently of this workflow.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run tests (includes copy guardrail)
        run: npm test

  # Proves worker RLS isolation against a NON-PROD Supabase project. Self-skips (green) when the
  # secrets are absent, so it never blocks until you wire a staging project. To ENFORCE: add repo
  # secrets RLS_TEST_URL / RLS_TEST_ANON_KEY / RLS_TEST_SERVICE_ROLE_KEY (a throwaway test project,
  # never prod) and require this check in branch protection.
  rls-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: RLS isolation harness (worker<->worker)
        env:
          SUPABASE_TEST_URL: ${{ secrets.RLS_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.RLS_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.RLS_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:rls

  # Firm-side companion to rls-isolation above — proves the worker<->firm boundary and
  # firm<->firm isolation. Same self-skip / same secrets / same staging-only guard.
  rls-firm-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: RLS isolation harness (worker<->firm, firm<->firm)
        env:
          SUPABASE_TEST_URL: ${{ secrets.RLS_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.RLS_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.RLS_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:rls-firm
