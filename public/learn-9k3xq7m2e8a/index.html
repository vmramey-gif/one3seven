<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>one3seven Academy — Get Certified with Morgan</title>
<style>
  :root{
    --bg:#0E1512;--bg2:#0A100D;--panel:#16201B;--ink:#ECF0E8;--soft:#9DA99F;--faint:#6B776E;
    --sage:#8FB8A2;--sage-deep:#B7D2C4;--orange:#E08A4E;--orange-soft:#2A1B10;--violet:#8B7DD8;--amber:#E0B84E;--red:#D97A6C;--line:#263029;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --sans:'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;} html,body{margin:0;}
  body{background:radial-gradient(120% 80% at 50% 0%,#16201B 0%,var(--bg) 46%,var(--bg2) 100%);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 70px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand{font-family:var(--serif);font-weight:600;font-size:18px;cursor:pointer;} .brand b{color:var(--orange);} .brand .m{color:var(--sage);}
  .topmeta{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  a{color:var(--sage-deep);text-decoration:none;} a:hover{text-decoration:underline;}
  button{font-family:var(--sans);cursor:pointer;}
  .btn{background:var(--sage);color:#0E1512;border:none;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;}
  .btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500;}
  .btn.orange{background:var(--orange);color:#0E1512;}
  .btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .crumbs{font-family:var(--mono);font-size:12px;color:var(--faint);margin:18px 0 4px;} .crumbs a{color:var(--faint);}
  /* HOME */
  .hero{margin:22px 0 6px;} .kick{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,5.5vw,52px);letter-spacing:-.015em;line-height:1.04;margin:8px 0 12px;text-wrap:balance;}
  .lede{color:var(--soft);font-size:16.5px;max-width:60ch;line-height:1.55;margin:0;} .lede b{color:var(--ink);}
  .prog{margin:22px 0;border:1px solid var(--line);border-radius:14px;background:#131c17;padding:14px 16px;}
  .bar{height:8px;border-radius:6px;background:#0f1713;overflow:hidden;border:1px solid var(--line);} .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),var(--orange));transition:width .3s;}
  .prog .pl{font-family:var(--mono);font-size:12px;color:var(--soft);margin-top:8px;} .prog .pl b{color:var(--sage);}
  .sec{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;}
  .sec .t{color:var(--sage);}
  .courses{display:grid;grid-template-columns:1fr 1fr;gap:14px;} @media(max-width:720px){.courses{grid-template-columns:1fr;}}
  .cc{border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,#17211C,#101713);padding:18px;display:flex;flex-direction:column;gap:8px;}
  .cc.open{cursor:pointer;} .cc.open:hover{border-color:var(--sage);transform:translateY(-2px);transition:.2s;}
  .cc.soon{opacity:.6;}
  .cc .track{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage);}
  .cc .ct{font-family:var(--serif);font-size:21px;line-height:1.15;} .cc .cs{color:var(--soft);font-size:13px;line-height:1.45;flex:1;}
  .cc .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;}
  .pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid;}
  .p-core{color:var(--orange);border-color:var(--orange);} .p-done{color:var(--sage);border-color:var(--sage);background:#12201a;} .p-soon{color:var(--faint);border-color:var(--line);}
  .mini{font-family:var(--mono);font-size:11px;color:var(--faint);}
  /* LESSON */
  .lessonwrap{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:10px;}
  .resnote{margin-top:14px;font-size:12.5px;color:var(--faint);max-width:60ch;line-height:1.5;}
  .lprog{display:flex;align-items:center;gap:12px;margin:2px 0 16px;}
  .lstep{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;}
  .lbar{flex:1;height:4px;background:#13201a;border-radius:3px;overflow:hidden;} .lbar i{display:block;height:100%;background:var(--sage);border-radius:3px;transition:width .3s;}
  @media(max-width:760px){.lessonwrap{grid-template-columns:1fr;} .rail{position:static;display:flex;gap:6px;overflow-x:auto;padding:8px;} .rail .rt{display:none;} .rail button{width:auto;white-space:nowrap;flex:none;font-size:12px;padding:7px 10px;} .rail .dot{display:none;}}
  .rail{border:1px solid var(--line);border-radius:14px;background:#131c17;padding:12px;height:max-content;position:sticky;top:14px;}
  .rail .rt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:2px 6px 8px;}
  .rail button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;color:var(--soft);font-size:13px;padding:8px;border-radius:8px;line-height:1.35;}
  .rail button:hover{background:#0f1713;} .rail button.active{background:var(--orange-soft);color:var(--ink);}
  .rail .dot{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--faint);flex:none;margin-top:1px;position:relative;}
  .rail button.done .dot{background:var(--sage);border-color:var(--sage);} .rail button.done .dot::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#0E1512;font-size:10px;font-weight:700;}
  .lesson h2{font-family:var(--serif);font-size:clamp(24px,3.6vw,34px);letter-spacing:-.01em;margin:6px 0 4px;}
  .lesson .obj{color:var(--sage-deep);font-size:14px;font-style:italic;border-left:2px solid var(--sage);padding-left:12px;margin:0 0 18px;line-height:1.5;}
  .lesson h3{font-family:var(--serif);font-size:20px;margin:22px 0 6px;color:var(--ink);}
  .lesson p{font-size:15.5px;line-height:1.62;color:var(--soft);margin:0 0 12px;max-width:64ch;} .lesson p b{color:var(--ink);}
  .say{border-left:3px solid var(--sage);background:#12201a;border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 12px;font-size:14.5px;color:var(--ink);max-width:64ch;}
  .say::before{content:'SAY';font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--sage);display:block;margin-bottom:3px;}
  .never{border-left:3px solid var(--red);background:#20130f;border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 12px;font-size:14.5px;color:#F0B7AD;max-width:64ch;}
  .never::before{content:'NEVER';font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--red);display:block;margin-bottom:3px;}
  .cites{margin:22px 0 4px;padding-top:14px;border-top:1px solid var(--line);}
  .cites-h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:8px;}
  .cites ul{margin:0;padding:0;list-style:none;}
  .cites li{font-size:12.5px;line-height:1.5;color:var(--sage-deep);padding:3px 0 3px 16px;position:relative;}
  .cites li::before{content:'§';position:absolute;left:0;color:var(--sage);}
  .cites a{color:var(--sage);text-decoration:underline;text-underline-offset:2px;}
  .cites .internal{color:#8a938c;}
  .filmlink{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--orange);color:var(--orange);border-radius:999px;padding:8px 14px;font-size:13px;margin:4px 0 14px;}
  .listen{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--sage);background:#12201a;border:1px solid var(--sage);border-radius:999px;padding:8px 15px;margin:2px 0 18px;cursor:pointer;}
  .listen:hover{background:#16281f;} .listen:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
  .listen.playing{color:var(--orange);border-color:var(--orange);background:var(--orange-soft);}
  .lnav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;border-top:1px solid var(--line);padding-top:16px;}
  /* QUIZ */
  .quiz{border:1px solid var(--line);border-radius:16px;background:#131c17;padding:20px;margin-top:10px;}
  .quiz .qi{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:12px;}
  .qq{font-size:16px;color:var(--ink);margin:0 0 12px;line-height:1.5;} .qq .tag{font-family:var(--mono);font-size:11px;color:var(--amber);display:block;margin-bottom:4px;}
  .opts{display:flex;flex-direction:column;gap:8px;} .opt{border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#0f1713;color:var(--soft);font-size:14px;text-align:left;}
  .opt:hover{border-color:var(--sage);} .opt.pick{border-color:var(--orange);color:var(--ink);}
  .opt.right{border-color:var(--sage);background:#12201a;color:var(--sage-deep);} .opt.wrong{border-color:var(--red);background:#20130f;color:#F0B7AD;}
  .fb{margin-top:12px;font-size:14px;line-height:1.5;padding:12px 14px;border-radius:10px;} .fb.ok{background:#12201a;color:var(--sage-deep);border:1px solid var(--sage);} .fb.no{background:#20130f;color:#F0B7AD;border:1px solid var(--red);}
  .demo{margin-top:14px;border-left:3px solid var(--amber);background:#231e10;border-radius:0 10px 10px 0;padding:10px 14px;font-size:13.5px;color:#EBD9A0;line-height:1.5;} .demo b{color:#fff;}
  /* CERT */
  .cert{border:2px solid var(--sage);border-radius:20px;background:linear-gradient(160deg,#12201a,#0f1713);padding:30px;text-align:center;margin-top:16px;}
  .cert .cm{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);}
  .cert h2{font-family:var(--serif);font-size:30px;margin:8px 0;} .cert p{color:var(--soft);font-size:14px;line-height:1.55;max-width:52ch;margin:0 auto;}
  .foot{margin-top:30px;font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.7;}
  .hidden{display:none;}
  /* CERTIFICATE (light paper, print-ready) */
  .certificate{background:#FBF8F1;color:#22201b;border:1px solid #d8cfbe;border-radius:8px;max-width:840px;margin:12px auto;padding:40px 44px;box-shadow:0 24px 70px rgba(0,0,0,.45);}
  .certificate .frame{border:2px solid #cdb98f;border-radius:4px;padding:32px 28px;text-align:center;}
  .cert-crest{width:54px;height:62px;margin:0 auto 6px;display:block;}
  .cert-school{font-family:var(--serif);font-size:27px;font-weight:600;color:#22201b;} .cert-school b{color:#b5652e;}
  .cert-morgan{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a6d3b;margin-top:3px;}
  .cert-rule{height:1px;background:#cdb98f;margin:16px auto;width:55%;}
  .cert-kind{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8a6d3b;}
  .cert-level{font-family:var(--serif);font-size:16px;color:#5a5347;margin-top:4px;}
  .cert-pre{font-size:13px;color:#5a5347;margin:22px 0 4px;letter-spacing:.02em;}
  .cert-name{font-family:var(--serif);font-size:clamp(30px,5vw,42px);font-weight:600;color:#22201b;line-height:1.1;margin:0 0 6px;}
  .cert-nameline{height:1px;background:#cdb98f;width:58%;margin:0 auto 16px;}
  .cert-body{font-size:14.5px;color:#3a352c;line-height:1.62;max-width:54ch;margin:0 auto 8px;}
  .cert-sig{margin-top:30px;} .cert-sig .l{border-top:1px solid #8a8172;width:200px;margin:0 auto 4px;} .cert-sig .r{font-size:11px;color:#6a6152;letter-spacing:.03em;}
  .cert-meta{display:flex;justify-content:space-between;gap:20px;font-family:var(--mono);font-size:11px;color:#6a6152;margin-top:24px;padding:0 4px;}
  .cert-disclaimer{font-family:var(--mono);font-size:9.5px;color:#8a8172;line-height:1.5;margin:20px auto 0;max-width:64ch;text-align:center;}
  .cert-actions{max-width:840px;margin:14px auto;display:flex;gap:10px;justify-content:center;}
  @media print{
    @page{size:landscape;margin:.4in;}
    body *{visibility:hidden;}
    #cert-print, #cert-print *{visibility:visible;}
    #cert-print{position:absolute;left:0;top:0;width:100%;}
    .certificate{box-shadow:none;border:none;margin:0;max-width:100%;}
  }
  /* UNIVERSITY HOME */
  .nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .nav .wm{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .nav .wm .crest{width:38px;height:44px;flex:none;}
  .nav .wm .txt .n{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;} .nav .wm .txt .n b{color:var(--orange);}
  .nav .wm .txt .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);margin-top:1px;}
  .nav .links{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .nav .links a{font-family:var(--sans);font-size:13.5px;color:var(--soft);padding:8px 12px;border-radius:8px;cursor:pointer;} .nav .links a:hover{background:var(--panel);text-decoration:none;color:var(--ink);}
  .nav .signin{font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;}
  .nav .signin:hover{border-color:var(--sage);}
  .uhero{position:relative;margin:26px 0 8px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
    background:linear-gradient(150deg,#1a2620 0%,#101713 60%,#0c120f 100%);padding:clamp(28px,5vw,52px);}
  .uhero::after{content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(224,138,78,.14),transparent 70%);}
  .uhero .est{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sage);}
  .uhero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,5vw,52px);line-height:1.05;letter-spacing:-.015em;margin:12px 0 6px;max-width:20ch;}
  .uhero .motto{font-family:var(--serif);font-style:italic;font-size:clamp(15px,2vw,20px);color:var(--sage-deep);margin:0 0 16px;}
  .uhero .sub{color:var(--soft);font-size:16px;max-width:56ch;line-height:1.55;margin:0 0 22px;} .uhero .sub b{color:var(--ink);}
  .uhero .cta{display:flex;gap:10px;flex-wrap:wrap;}
  .colleges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px;} @media(max-width:760px){.colleges{grid-template-columns:1fr 1fr;}} @media(max-width:460px){.colleges{grid-template-columns:1fr;}}
  .col{border:1px solid var(--line);border-radius:14px;background:#131c17;padding:14px 15px;} .col .cn{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  .col .cc2{font-family:var(--serif);font-size:18px;margin:3px 0 2px;} .col .cd{color:var(--soft);font-size:12px;line-height:1.4;}
  .col.col-link{cursor:pointer;transition:border-color .2s,transform .2s;} .col.col-link:hover{border-color:var(--sage);transform:translateY(-2px);}
  .cc.pathlink{cursor:pointer;transition:border-color .2s,transform .2s;} .cc.pathlink:hover{border-color:var(--orange);transform:translateY(-2px);}
  a.cc.cc-link{text-decoration:none;color:inherit;transition:border-color .2s,transform .2s;} a.cc.cc-link:hover{border-color:var(--orange);transform:translateY(-2px);}
  .col.col-link .more{font-family:var(--mono);font-size:10px;color:var(--sage);margin-top:8px;}
  .cintro{color:var(--soft);font-size:15.5px;line-height:1.6;max-width:64ch;margin:6px 0 6px;} .cintro b{color:var(--ink);}
  .reslist{list-style:none;padding:0;margin:14px 0 0;}

  .res.done{border-color:var(--sage);background:#12201a;}

  .cprog{font-family:var(--mono);font-size:12px;color:var(--soft);margin:12px 0 2px;} .cprog b{color:var(--sage);}
  .lens{border:1px solid var(--sage);border-radius:14px;background:linear-gradient(160deg,#12201a,#0f1713);padding:16px 18px;margin:14px 0 6px;}
  .lens-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-bottom:9px;}
  .lens p{font-size:14.5px;color:var(--soft);line-height:1.6;margin:0 0 10px;max-width:66ch;} .lens p b{color:var(--ink);}

  .res .rh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .res .rn{font-size:15px;color:var(--ink);} .res .rn a{color:var(--sage-deep);} .res .rp{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}

  { id:'worker', track:'Core · Track 1', title:'The Worker & The Mission', core:true,
    blurb:'Who we serve and why — and the one habit that keeps warmth from becoming a promise you can’t keep.',
    lessons:[
      { t:'Who the worker is', obj:'See the person on the other side, and understand what the company is really promising them.',
        blocks:[
          {p:'The people one3seven serves are usually scared, and usually new to this. They may have just lost a job, fallen behind on rent, and be reaching out about a legal problem for the first time in their life. They are not a “lead.” They are a person in the middle of a hard moment, deciding whether to trust a stranger with it.'},
          {p:'Many arrive braced to be dismissed — because they already have been. An employer waved them off, an HR line went in circles, a lawyer’s voicemail never called back. That is the experience the whole product is built to answer.'},
          {p:'Our promise is <b>ownership</b>: the worker’s record is theirs, start to finish — we organize it, we never take it over, and they choose who ever sees it. They’ve spent this whole ordeal as a passenger in their own story; here, they’re driving. Everything one3seven does — the way the app is written, the way we sell it, the way anyone talks about a worker — has to keep that true. When a decision is unclear, this is the tie-breaker: choose the option that leaves the worker in the driver’s seat, treated as a person, not a transaction.'},
          {p:'This is also the company’s edge, not just its conscience. The entire market treats workers as inventory to be scored and routed. The moment one3seven drifts into that, it becomes one more funnel. Staying genuinely worker-first is the moat — so understanding the worker is everyone’s job, whether or not you ever speak to one directly.'},
          {p:'A picture to keep in mind: the single parent who quietly screenshotted every last-minute schedule change at 2 a.m. because they sensed something was wrong. That instinct is why they found us. Treat it with respect.'},
        ]},
      { t:'Empathy without overpromising', obj:'Be warm and human while never predicting an outcome or giving legal advice.',
        blocks:[
          {p:'Warmth and honesty are not in tension. You can care deeply and still hold the line. The trap is that empathy quietly tips into a promise you can’t keep — and that same reflex is the one you’ll need everywhere else at one3seven: care about the person, never predict the outcome.'},
          {p:'It matters more here than almost anywhere, because a frightened person hears <b>hope</b> in whatever you say. A throwaway “that sounds unfair” can become, in their memory, “they told me I have a case.” Guard your words the way you would guard theirs.'},
          {never:'You definitely have a case. · You’ll probably win. · Here’s what you should do legally.'},
          {say:'I can’t tell you how this turns out — that’s for an attorney. What I can do is help you get your record organized so a lawyer can look at it clearly.'},
          {p:'And honesty is itself a kindness. False hope is a cruelty: it costs a worker months and money chasing a door that was never open. Telling the truth gently is the more caring thing — not the colder one.'},
          {p:'None of this means going cold. Warmth is the point — you can say “that sounds really hard, take your time, there’s no rush” all day long. Reassure the <b>person</b> as much as you want; just never reassure the <b>outcome</b>. “I’m here, we’ll go at your pace” is safe. “It’ll be fine, you’ll win” is not. That single distinction is the whole skill.'},
          {p:'Know one boundary precisely: you are not a therapist and you are not a lawyer. For a hard moment, your steady presence is enough. But if a worker is in real crisis — someone in danger, talking about self-harm, making threats — your job is to stay kind and <b>escalate to a founder immediately</b>, not to counsel them. That is a safety line, not a suggestion.'},
          {p:'This lesson is the worker-facing slice of a bigger rule. The full list of lines nobody at one3seven may cross — with a firm, in a demo, anywhere — lives in <b>The Doctrine</b>, which is the required next course.'},
        ]},
    ],
    quiz:{ intro:'Apply what you learned', items:[
      { apply:true, q:'A worker asks, “Do you think I’ll win?” What do you say?',
        opts:[
          {t:'“Honestly, your case sounds strong.”',ok:false},
          {t:'“I can’t say how it’ll turn out — that’s for an attorney. What I can do is help you get your record organized so a lawyer can look at it clearly.”',ok:true},
          {t:'“You should probably file a lawsuit.”',ok:false},
        ], fb:{ ok:'Exactly — hold the no-promise line, and redirect to what you can actually do.', no:'That either overpromises or gives legal advice. Never predict the outcome; redirect to organizing the record.' } },
      { gate:true, q:'A worker mentions, in passing, that they’ve been thinking about hurting themselves. What do you do?',
        opts:[
          {t:'Stay on the phone and try to talk them through it yourself — you want to help.',ok:false},
          {t:'Stay kind, and escalate to a founder immediately. This is a safety line, not something to handle solo.',ok:true},
          {t:'Make a note of it and follow up once things are less busy.',ok:false},
        ], fb:{ ok:'Correct — you are not a therapist. Your steady presence in the moment is enough; a founder handles what comes next, right away.', no:'This is the one line in the whole curriculum that isn’t a suggestion. You are not a therapist or a counselor — stay kind, and escalate to a founder immediately. Not later, not handled yourself.' } },
      { q:'What does one3seven promise the worker about their record?',
        opts:[
          {t:'“You will win your case.”',ok:false},
          {t:'“It’s yours — start to finish. You own it, and you choose who ever sees it.”',ok:true},
        ], fb:{ ok:'Right — ownership is the promise, and every decision is measured against whether it keeps the worker in the driver’s seat.', no:'The promise is ownership: the record stays theirs, start to finish. We never promise an outcome.' } },
    ]},
  },
  { id:'doctrine', track:'Core · Track 6', title:'The Doctrine', core:true,
    blurb:'Organize, never conclude — the never-say lines, and the rules that keep the whole model clean.',
    lessons:[
      { t:'Organize, never conclude', obj:'State the one rule everything else hangs from — and why it protects everyone.',
        blocks:[
          {p:'The entire company runs on a single rule: <b>we organize and reflect the record; we never conclude.</b> We can show what is present, what is missing, and where each fact came from. We can never say what it <i>proves</i>, whether there is a case, or what it is worth.'},
          {p:'A shorthand worth memorizing: <b>revelation is safe; conclusion is not.</b> Pointing at a document is revelation. Telling someone what the document means for their legal rights is conclusion — and that is practicing law.'},
          {p:'Why the discipline is not just caution: concluding is the <b>unauthorized practice of law</b> when we’re not the attorney, and it is exactly what a court or a bar would seize on. Refusing to conclude is what lets a real firm safely put one3seven in front of a client at all.'},
          {p:'So the line does triple duty — it protects the <b>worker</b> from false hope, the <b>firm</b> from an ethics problem, and <b>one3seven</b> from liability, all with one habit. Hold it and almost everything else takes care of itself.'},
        ], cites:[
          {label:'Bus. & Prof. Code §§6125–6126 — unauthorized practice of law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
          {label:'one3seven Doctrine — internal (organize, never conclude)'},
        ]},
      { t:'Source-linked vs worker-stated', obj:'Separate what a document shows from what a person told us — and never blur them.',
        blocks:[
          {p:'Two very different kinds of “fact” live in every record. A <b>source-linked</b> fact points to a document you can open — a pay stub, a text, a schedule. A <b>worker-stated</b> fact is something the worker told us that no document yet backs up.'},
          {p:'Both belong in the record, and both are presented honestly — but they are <b>never</b> dressed up as each other. “The pay stub shows $22/hour” is source-linked. “My manager said I’d get overtime” is worker-stated. Collapsing the second into the first is exactly the kind of quiet overclaim that destroys a firm’s trust.'},
          {p:'This is also one3seven’s moat in a sentence: <b>every source-linked fact traces to its page in one click.</b> An attorney can verify in seconds instead of reconstructing for an hour. Provenance is the product.'},
          {p:'The safe reflex, whenever you’re unsure: <b>describe the record and let the attorney weigh it.</b> “Here’s the pay stub; here’s what the worker said about it” — and stop. That phrase is your reset button any time a conversation drifts toward a conclusion.'},
        ], cites:[
          {label:'Bus. & Prof. Code §17200 — unfair/deceptive practices (why overclaiming a fact is a legal risk, not just style)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=17200.'},
          {label:'one3seven Doctrine — internal (source-linked vs worker-stated; provenance is the product)'},
        ]},
      { t:'The never-say lines', obj:'Memorize the exact statements nobody at one3seven may make.',
        blocks:[
          {p:'These are not style preferences. Each one is a sentence that can create real legal exposure the moment it leaves your mouth — in a call, an email, a demo, or a hallway.'},
          {never:'“Our AI finds / ranks the strongest cases.” · “This case is worth $X.” · “You’ll win / you have a strong case.” · “Your filing deadline is…” · “It’s flawless / never wrong.” · “We’ll send you to the right firm.”'},
          {say:'We show how complete the record is against what the law requires — your attorney decides.'},
          {p:'Notice the pattern: every banned line either <b>predicts an outcome</b>, <b>assigns a value</b>, <b>gives legal advice</b>, <b>overclaims accuracy</b>, or <b>routes a client</b>. If a sentence does any of those five things, it’s a never-say — even one you’ve never seen before.'},
          {p:'The universal escape hatch: if you’re unsure whether a sentence crosses the line, it probably does — so fall back to <b>describe the record and let the attorney decide.</b> That single phrase is doctrine-safe in every situation you will ever be in.'},
        ], cites:[
          {label:'Bus. & Prof. Code §6125 — predicting outcome/value or giving advice = practicing law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
          {label:'Bus. & Prof. Code §6155 — "we’ll send you to the right firm" = referral service', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6155.'},
          {label:'one3seven Doctrine — internal (the five never-say categories)'},
        ]},
      { t:'No scoring, no advice, no deadlines', obj:'Understand why the three most tempting shortcuts are the three most dangerous.',
        blocks:[
          {p:'<b>No case scoring.</b> Ranking or selecting the “best” cases is the single thing firms most want to hear — and the single fastest way to become the unauthorized practice of law. We show <b>coverage</b> (how much of what the law requires is on file), never a verdict. Coverage describes the record; a score judges the case.'},
          {p:'<b>No legal advice or deadlines.</b> Calculating a statute of limitations — telling someone “you must file by March” — <i>is</i> practicing law. We surface the dates that appear on the record or that the worker entered; the <b>attorney</b> calculates any deadline. We show dates; we never do the math on them.'},
          {p:'<b>No dollar value.</b> What a claim is worth turns on judgment, strategy, and facts we don’t have — it is the attorney’s call, never ours. “The record shows unpaid overtime hours” is fine; “that’s about $40,000” is a never-say.'},
          {p:'These three share one root: each substitutes <b>our</b> judgment for the attorney’s. The tell, every time, is a sentence that concludes something about the <i>case</i> rather than describing the <i>record</i>.'},
        ], cites:[
          {label:'Bus. & Prof. Code §6125 — legal advice & calculating deadlines are the practice of law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
          {label:'one3seven Doctrine — internal (coverage describes the record; it never scores the case)'},
        ]},
      { t:'Worker choice & firm independence', obj:'Explain, in plain English, why the worker chooses and why our money stays clean.',
        blocks:[
          {p:'The worker chooses their own attorney and can freely export and deliver their record to anyone they like. one3seven <b>never</b> steers a worker toward a firm that pays us — presenting a menu of paying firms is precisely what turns a company into a lawyer <b>referral service</b>, which is regulated under §6155. We are a tool the worker uses, not a service that refers them.'},
          {p:'The single question that keeps us clean: <b>does the worker choose the firm, or do we?</b> As long as the worker brings their own firm (or exports and walks the record in), we’re a tool. The moment we rank, match, or route, we’ve crossed into referral territory.'},
          {p:'Our money is just as disciplined. We are <b>never</b> paid out of a case — no percentage of a recovery, no per-signed-case fee. That’s the fee-sharing rule (CRPC 5.4): a non-lawyer can’t take a cut of legal fees. We charge a flat fee for software, decoupled from any outcome. Clean money only.'},
          {p:'You do not need a law degree to hold any of this. It compresses to seven words: <b>the worker chooses, we organize, the attorney concludes.</b>'},
        ], cites:[
          {label:'Bus. & Prof. Code §6155 — lawyer referral services (why we never rank/route)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6155.'},
          {label:'Cal. Rules of Prof. Conduct 5.4 — no fee-sharing with non-lawyers (clean money)', url:'https://www.calbar.ca.gov/Attorneys/Conduct-Discipline/Rules/Rules-of-Professional-Conduct/Current-Rules'},
          {label:'one3seven Doctrine — internal (worker chooses; flat software fee)'},
        ]},
    ],
    quiz:{ intro:'The doctrine gate — this one must be right', items:[
      { gate:true, q:'A firm asks, “Can it tell us if the worker has a case?” What’s the correct answer?',
        opts:[
          {t:'“Yes — that’s the point.”',ok:false},
          {t:'“No, and that’s deliberate — we organize and reflect; your firm makes every legal decision.”',ok:true},
          {t:'“It gives each case a score.”',ok:false},
        ], fb:{ ok:'Correct — and held with confidence. That line is the moat.', no:'This is the doctrine trap. The answer is a clear no — we never conclude whether there’s a case.' } },
      { gate:true, q:'Which statement is one you may NOT make?',
        opts:[
          {t:'“We show how complete the record is against what the law requires.”',ok:false},
          {t:'“Based on this, you’ll probably win about $40,000.”',ok:true},
          {t:'“The worker chooses which firm sees their record.”',ok:false},
        ], fb:{ ok:'Right — predicting an outcome and a dollar value crosses two lines at once.', no:'Read again — one of these predicts an outcome and a dollar amount. That’s a never-say.' } },
    ]},
  },

  { id:'product', track:'Core · Track 1', title:'The Product', core:true,
    blurb:'What one3seven does, the core workflow, and its limits — the basics everyone here can explain.',
    lessons:[
      { t:'What one3seven is', obj:'Explain, in one breath, what one3seven does and for whom.',
        blocks:[
          {p:'one3seven helps a worker <b>organize their own employment record</b> — pay stubs, emails, schedules, texts — into a clear, source-linked file, and then <b>choose</b> to share it with an employment attorney.'},
          {p:'The one-line version to keep in your pocket: <b>an organized record, in the worker’s hands.</b> Not a lawyer, not advice, not a verdict — a clean, verifiable file the worker owns and controls.'},
          {p:'It helps to name what it replaces. Today a worker walks into a firm with a shoebox — a phone full of screenshots, a folder of PDFs, a story in their head — and a paralegal spends the first hour of the intake reconstructing it. one3seven does that reconstruction <b>before</b> anyone reaches an attorney, and hands the firm a finished file instead of a pile.'},
          {p:'The customers are two, and it matters which is which: the <b>worker</b> is who we serve and who owns the record; the <b>firm</b> is who eventually pays for the software to receive and work it. The product is built worker-first for exactly that reason.'},
        ]},
      { t:'The worker’s side', obj:'Describe what the worker actually does — and what the product does for them.',
        blocks:[
          {p:'The worker drops in documents — no sorting, no folders, no “which category is this?” one3seven infers the document types on its own and reconstructs a <b>timeline</b> of what happened when. Only the worker’s name is required to begin.'},
          {p:'As they go, the product shows them <b>what’s still missing</b> against what a claim like theirs typically needs — so instead of guessing, the worker can see the gaps and gather the specific records that fill them. When a document isn’t in their possession, one3seven can even draft the records-request letter for them.'},
          {p:'They keep their own <b>reminders and important dates</b> in one place — hearing dates a firm gave them, a date they entered themselves, dates that appear on a record. Every date is tagged by where it came from.'},
          {p:'The one hard limit to state plainly here: those dates are <b>surfaced, never calculated.</b> one3seven does not compute a filing deadline or a “days left” countdown — that is the attorney’s call, and doing the math ourselves would cross the doctrine line (see <b>The Doctrine</b> for why).'},
          {p:'Underneath it all: the worker <b>owns and can export the entire file at any time</b>, with or without ever involving a firm. That ownership is not a nicety — it’s the foundation of the whole model.'},
        ]},
      { t:'How it reaches a firm', obj:'Explain the two paths a record can travel — and who is in control of both.',
        blocks:[
          {p:'There are exactly two ways a record gets to an attorney, and both are driven by the worker: they enter a firm’s <b>code</b> and share it directly, or they <b>export</b> the finished file and hand it to any attorney they choose.'},
          {say:'Nothing is sent to anyone until you decide. You choose who sees your record.'},
          {p:'If the firm the worker picks is a one3seven customer, they receive the rich interactive version (next lesson). If not, the worker simply exports and delivers it — and that firm, seeing the value, often becomes the next customer. Either way the worker is never stuck and never gated.'},
          {p:'The reason it works this way is doctrine, not just design: <b>the worker chooses the firm; one3seven never picks one for them.</b> That is the exact line that keeps us a tool rather than a referral service — the full explanation lives in <b>The Doctrine</b>.'},
        ]},
      { t:'The firm’s side', obj:'Describe what an attorney actually sees when a worker shares a record.',
        blocks:[
          {p:'A firm opens a <b>binder</b>, not a data dump. The front of it is a <b>decision card</b> — the ten-second read: who the worker is, the sequence of events, the key dates, the records on file.'},
          {p:'Behind it sits the <b>Element Lens</b>. For a given kind of claim, the law requires certain elements to be shown; the Element Lens displays how many of those elements have material <b>on file</b> and, just as importantly, where the <b>gaps</b> are. That “how much is covered” figure is the <b>Coverage Rate</b> — and it is a completeness measure, <b>never</b> a judgment of whether the case is good (that distinction is the whole ballgame; see The Doctrine).'},
          {p:'The feature that earns an attorney’s trust is <b>source-linking</b>: click any fact and the exact page it came from opens beside it. Verification drops from twenty minutes of hunting to one click. For a lawyer whose license rides on not repeating an unverified claim, that is the difference between usable and not.'},
          {p:'And the firm can act right there — accept, request more documents, or decline — each in a click. The tool organizes; the attorney decides. That handoff is deliberate, and it never inverts.'},
        ]},
      { t:'What it does NOT do', obj:'State the product’s limits clearly — because the limits are the product.',
        blocks:[
          {p:'A one3seven person should be able to recite the limits as fluently as the features. The product does <b>not</b> score or rank cases, predict an outcome or a value, give legal advice or compute deadlines, or route workers to firms for a fee. (Those are the never-say lines — owned and explained in <b>The Doctrine</b>.)'},
          {p:'Say it as a strength, because it is one: one3seven <b>organizes and reflects</b> the record; the attorney concludes. Every competitor that scores, values, or routes has taken on legal risk we deliberately refuse.'},
          {p:'If you remember one thing about the product, remember its <b>restraint</b>. The discipline about what it won’t do is not a limitation bolted onto the moat — it <i>is</i> the moat.'},
        ]},
    ],
    quiz:{ intro:'Apply what you learned', items:[
      { apply:true, q:'A worker asks, “Once I upload everything, will you automatically send it to a law firm?” What’s the right answer?',
        opts:[
          {t:'“Yes, we match you to the best firm automatically.”',ok:false},
          {t:'“No — nothing is sent until you choose. You pick the firm and decide when to share.”',ok:true},
          {t:'“We send it to all the firms in our network.”',ok:false},
        ], fb:{ ok:'Right — worker-driven, worker-chosen. That is the whole model.', no:'one3seven never auto-routes or matches. The worker chooses the firm and decides when to share.' } },
      { q:'What does a firm get from the Element Lens?',
        opts:[
          {t:'A score for how strong the case is.',ok:false},
          {t:'How much of what the law requires is on file, and where the gaps are.',ok:true},
        ], fb:{ ok:'Correct — coverage of the record, never a verdict.', no:'The Element Lens shows coverage (on file vs required) — it never scores or judges the case.' } },
    ]},
  },
  { id:'trust', track:'Core · Track 3/4', title:'Trust in Practice', core:true,
    blurb:'Handling worker information safely — the applied privacy & security you use every day.',
    lessons:[
      { t:'Why the worker owns the data', obj:'Grasp whose data this is, and the standard it must be held to.',
        blocks:[
          {p:'The record belongs to the <b>worker</b>, not to us. We are custodians of some of the most sensitive information a person has: the story of how they lost their job, their exact pay, screenshots of private conversations, sometimes health or immigration details tucked inside the documents.'},
          {p:'Hold it to a <b>privileged-adjacent</b> standard — guard it the way a law firm guards a client file. That is not us being dramatic. When a firm eventually works with a worker’s record, the attorney’s duty of confidentiality (Rule 1.6) effectively extends to the vendors touching that data. If we’re sloppy, we don’t just embarrass ourselves — we can compromise the firm’s ethical obligations.'},
          {p:'So this is the quiet reason a compliant firm can hire us at all: our data discipline is what makes one3seven <b>hirable</b>. Lose that and there is no business, no matter how good the product is.'},
          {p:'And it ties straight back to the mission — a worker who trusts us with the worst week of their life is owed that trust in how their data is handled. Privacy here is dignity, continued past the conversation.'},
        ], cites:[
          {label:'Cal. Rules of Prof. Conduct 1.6 — duty of confidentiality (extends to the firm’s vendors)', url:'https://www.calbar.ca.gov/Attorneys/Conduct-Discipline/Rules/Rules-of-Professional-Conduct/Current-Rules'},
          {label:'Cal. State Bar Formal Opinion 2010-179 — confidentiality & the use of technology'},
          {label:'Civ. Code §1798.100 et seq. — CCPA / CPRA (consumer data rights)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.100.'},
        ]},
      { t:'Least privilege', obj:'Touch only what your job needs — and understand that the system enforces it.',
        blocks:[
          {p:'The principle is simple: see only what your role actually requires, only when you need it. A firm cannot see a worker’s intake until the <b>worker grants full access</b> — and that boundary is enforced by the database itself (row-level security), not by anyone remembering a policy.'},
          {p:'That “enforced, not promised” part matters. Every worker’s records are walled off from every other firm and every other worker at the data layer, so a leak can’t happen just because someone clicked the wrong thing. But the wall only holds if we don’t deliberately reach around it.'},
          {p:'So don’t go browsing records that aren’t yours to work on. <b>“I was curious” is never a reason to open someone’s file.</b> Curiosity about a “wild case” is exactly the instinct to distrust in yourself.'},
          {p:'If you ever find you <i>can</i> see something you don’t think you should — that’s not a lucky shortcut, it’s a bug. Report it (last lesson tells you how). Finding a gap and flagging it is one of the most valuable things you can do here.'},
        ], cites:[
          {label:'Civ. Code §1798.100 — CCPA / CPRA (data minimization & access limits)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.100.'},
          {label:'one3seven Security Curriculum — internal (row-level security enforces least privilege)'},
        ]},
      { t:'Handling records safely', obj:'Build the everyday habits that keep worker data safe.',
        blocks:[
          {p:'The single most common way sensitive data leaks at an AI company is boring: someone pastes it into a tool that wasn’t built to hold it, to save five minutes.'},
          {never:'Pasting a worker’s document or details into a personal or public AI tool (public ChatGPT, a random summarizer, a personal drive) — even “just part of it,” even “just to summarize.”'},
          {p:'Use <b>only the approved systems</b> for anything containing worker information. If you’re not sure whether a tool is approved, treat it as “no” and ask. There is no summary worth a confidentiality breach.'},
          {p:'The ordinary hygiene still matters and is not optional: lock your devices, use MFA everywhere, don’t leave a screen open in a coffee shop, and don’t retell a worker’s story where it isn’t needed. A breach is usually a small habit that slipped, not a movie-style hack.'},
          {p:'Be alert to <b>phishing and social engineering</b> — the email that looks like a firm asking for a worker’s file “urgently,” the login page that’s slightly off. When in doubt, slow down and verify through a channel you already trust. Urgency is the con artist’s favorite tool.'},
          {p:'Privacy is a <b>habit</b>, not a policy you read once and forget. It’s the hundred small choices a day, not the one document you signed.'},
        ], cites:[
          {label:'Civ. Code §1798.81.5 — reasonable security procedures for personal information', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.81.5.'},
          {label:'one3seven Security Curriculum — internal (approved-tools-only; phishing awareness)'},
        ]},
      { t:'When something goes wrong', obj:'Respond correctly the moment an access, privacy, or security problem happens.',
        blocks:[
          {p:'You will, at some point, make or spot a mistake — saw a file you shouldn’t have, lost a laptop, clicked a link you shouldn’t have, sent something to the wrong person. What defines you here is the next ten minutes, not the mistake.'},
          {p:'The rule is one word: <b>report.</b> Immediately, to a founder. Don’t investigate it quietly first, don’t wait to see if it matters, don’t hope it goes away.'},
          {say:'I think I may have accessed / sent / lost something I shouldn’t have — flagging it right away so we can handle it.'},
          {p:'Why speed beats everything: most data incidents are containable if caught fast (revoke access, reset a credential, notify) and become real damage only when they’re hidden and age. A same-hour report is a non-event; a week-late one is a crisis.'},
          {p:'So the culture here is explicit: <b>fast, honest reporting is a strength, never a punishment.</b> Hiding a mistake is the only version of it that actually fails the worker — and it’s the only version anyone is ever in trouble for.'},
        ], cites:[
          {label:'Civ. Code §1798.82 — California data-breach notification law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.82.'},
          {label:'one3seven — internal (incident response: report to a founder immediately)'},
        ]},
      { t:'The promise we keep', obj:'State the concrete data promises one3seven makes — and why living them is the point.',
        blocks:[
          {p:'We make a few promises to workers and we keep them literally. We <b>never sell</b> worker data — not raw, not “anonymized,” not as “insights.” It is not a revenue line and never will be.'},
          {p:'The worker can <b>export</b> their full record whenever they want, and <b>delete</b> it. Their data is theirs to take and theirs to erase — ownership isn’t a slogan on the marketing page, it’s an actual capability.'},
          {p:'We collect what the work needs and no more, and we don’t repurpose it. The record exists to help this worker with this situation — not to train something, not to build a side dataset to sell.'},
          {p:'The through-line: a company that <b>teaches</b> privacy has to <b>live</b> it, visibly. Everything one3seven says about being worker-first and trustworthy is only as real as how the person reading this handles the next document they touch.'},
        ], cites:[
          {label:'Civ. Code §1798.105 — right to delete personal information', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.105.'},
          {label:'Civ. Code §1798.120 — right to opt out of sale (we never sell worker data)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.120.'},
          {label:'one3seven — internal (export, delete, never sell)'},
        ]},
    ],
    quiz:{ intro:'Apply what you learned', items:[
      { gate:true, q:'To summarize a worker’s uploaded document faster, you think about pasting it into public ChatGPT. What do you do?',
        opts:[
          {t:'Paste it in — it’s quicker.',ok:false},
          {t:'Never put worker data in an unapproved tool. Use only approved systems, or ask.',ok:true},
          {t:'Paste just part of it.',ok:false},
        ], fb:{ ok:'Correct — worker data never goes into an unapproved or public tool, full stop.', no:'Worker data must never go into an unapproved or public tool — not even part of it. Use approved systems or ask.' } },
      { q:'You accidentally opened a worker file that isn’t yours to work on. The right move is:',
        opts:[
          {t:'Say nothing; no harm done.',ok:false},
          {t:'Report it to a founder right away.',ok:true},
        ], fb:{ ok:'Right — report fast and honestly. That is a strength here.', no:'Report it immediately to a founder. Fast, honest reporting is never punished; hiding it is the failure.' } },
    ]},
  },
  { id:'howwework', track:'Core', title:'How We Work', core:true,
    blurb:'The values, quality bar, and habits that make one3seven trustworthy — how we operate.',
    lessons:[
      { t:'The mission above the task', obj:'Use worker-first as the tiebreaker when two good options pull apart.',
        blocks:[
          {p:'Most days the work is obvious. This lesson is for the days it isn’t — when two reasonable choices conflict and you have to pick. The tiebreaker is always the same: <b>worker-first.</b>'},
          {p:'Concretely, that means when a shortcut would help the task but bruise a worker’s dignity, rush their pace, or drift toward the doctrine line, the mission wins — even if it’s slower or harder. The promise the company makes (see <b>The Worker & The Mission</b>) is only real if it survives the moment it’s inconvenient.'},
          {p:'This also protects <i>you</i>: when you can point to “I chose the worker’s dignity / the safe line,” you will never be second-guessed here for it. Erring toward the mission is always the defensible call.'},
        ]},
      { t:'Quality over volume', obj:'Internalize why one3seven optimizes for precision, not throughput.',
        blocks:[
          {p:'one3seven’s moat is <b>accuracy</b>. A firm will trust the tool only if what it shows is right — and trust, once dented, doesn’t come back at the next intake, it’s gone for all of them. So we deliberately favor precision over recall.'},
          {p:'The rule that falls out of that: <b>a wrong fact is worse than a missing one.</b> A gap is honest — the firm sees “not on file” and moves on. A confident error is a landmine — the attorney relies on it and gets burned in front of a client or a court. We would rather show less and be right than show more and be wrong.'},
          {p:'So the instinct to resist is “ship it, it’s probably fine.” Do it right, not fast. One clean, correct record does more for the company than ten rushed ones — because a single sloppy one can cost the trust the other nine earned.'},
          {p:'This isn’t perfectionism for its own sake; it’s strategy. Competitors can copy a portal in a weekend. They cannot cheaply copy a reputation for being <b>right</b>. That reputation is built one careful record at a time, by you.'},
        ]},
      { t:'Say what’s true', obj:'Hold, internally, the same honesty discipline the product holds externally.',
        blocks:[
          {p:'one3seven’s public posture is <b>auditable, not flawless</b> — we don’t claim perfection, we make everything checkable. That same discipline has to run inside the company, not just in the pitch.'},
          {p:'Practically: never overclaim — about a case, about the product, about a metric, about what you got done. If you’re not certain, say so out loud. Confident-but-wrong is the exact failure mode we sell against, so we can’t live it ourselves.'},
          {say:'I’m not sure about that number — let me verify before we put it in front of anyone.'},
          {p:'Be especially careful with <b>figures and legal specifics</b> — a pricing number, a statute, a “firms usually…” claim. Verify before you repeat it, because the moment it leaves the building someone will treat it as fact. Flagging “I need to check that” is a mark of credibility here, never of weakness.'},
        ]},
      { t:'Document & hand off', obj:'Leave a trail the next person can act on without you in the room.',
        blocks:[
          {p:'We build clean, legible records for workers so an attorney can act without reconstructing anything. We owe each other exactly the same. Write things down so the next person — or you in three weeks — can pick it up cold.'},
          {p:'What to capture: a decision and <i>why</i>, a change and what it affects, a promise made to a firm or a worker. Put it where the team can find it, not just in your own head or a DM.'},
          {p:'The bar is simple and unforgiving: <b>undocumented is unfinished.</b> A brilliant call nobody can find is worth about as much as a call never made — and it quietly recreates the single-point-of-failure problem the whole company exists to remove.'},
        ]},
      { t:'Escalate & ask', obj:'Recognize the questions to route up instead of answering yourself.',
        blocks:[
          {p:'You are not alone and you are not expected to know everything. Two categories go <b>up</b>, every time, no matter how sure you feel: any <b>legal</b> question, and anything that would cross a doctrine or data line. Route those to a founder or counsel — never answer them yourself.'},
          {p:'Asking early is cheaper than a mistake, always. A thirty-second “can I say this?” beats a doctrine slip you can’t take back, or a worker who acted on advice you weren’t allowed to give. Nobody here loses standing for asking; people lose it for guessing on the things that matter.'},
          {p:'And when you’re genuinely unsure in the moment, you already have a safe default from <b>The Doctrine</b> — describe the record and route the judgment to the person whose call it actually is. Say less, flag more, and let the right person decide.'},
        ]},
    ],
    quiz:{ intro:'Apply what you learned', items:[
      { q:'A task would go faster if you skipped verifying a fact. The one3seven way is:',
        opts:[
          {t:'Skip it — speed matters most.',ok:false},
          {t:'Verify it — a wrong fact is worse than a slow one; accuracy is the moat.',ok:true},
        ], fb:{ ok:'Right — precision over speed, every time.', no:'Accuracy is the moat. A wrong fact can lose a firm’s trust; verify it.' } },
      { apply:true, q:'A worker asks you a specific legal question you think you know the answer to. What do you do?',
        opts:[
          {t:'Answer it — you’re pretty sure.',ok:false},
          {t:'Route it to a founder/counsel and stick to describing the record.',ok:true},
        ], fb:{ ok:'Correct — legal questions go up; you describe the record, the attorney concludes.', no:'Never answer a legal question yourself. Route it to a founder/counsel and describe the record.' } },
    ]},
  },
  { id:'emplaw', track:'Domain · Employment Law', title:'California Employment Law — for Fluency', core:true,
    blurb:'The laws behind the record — taught so you can recognize and describe, never diagnose. Grounded in the same statutes the product uses.',
    lessons:[
      { t:'Learn the law to describe — never to apply', obj:'Hold the one frame that makes learning employment law safe here.',
        blocks:[
          {p:'This course teaches you real California employment law. That is unusual for a company whose first rule is <b>never conclude</b> — so read this lesson before any other, because it is the frame that keeps the rest safe.'},
          {p:'You learn the law for three reasons: to <b>recognize</b> what a worker is describing, to know <b>which records</b> matter for it, and to speak credibly with a firm. You do <b>not</b> learn it to tell a worker what they have, whether they will win, or what to do. Knowing the elements of retaliation is fluency; telling a worker "you were retaliated against" is the unauthorized practice of law.'},
          {never:'"That’s clearly discrimination." · "You have a wage claim." · "This means you’ll win." · "You should sue."'},
          {say:'What you’re describing sounds like it touches on pay records and schedules — let’s get those organized so an attorney can look at it clearly.'},
          {p:'The tell is the same as always: describing the <b>record</b> ("here are the pay stubs and the dates") is safe; concluding about the <b>case</b> ("that’s a §510 overtime violation worth $X") is not. Keep every lesson below on the describe side of that line. <i>(Internal fluency training; counsel verifies any specific before it’s treated as authoritative.)</i>'},
        ], cites:[
          {label:'Bus. & Prof. Code §§6125–6126 — unauthorized practice of law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
          {label:'one3seven Doctrine — internal (organize, never conclude)'},
        ]},
      { t:'The money claims — wage & hour', obj:'Recognize the most common wage/hour claims and the records that show them.',
        blocks:[
          {p:'Most employment matters start with money. California wage law is dense and worker-protective. You don’t need to litigate it — you need to recognize the shapes and know what documents each one lives or dies on.'},
          {p:'<b>Overtime (§510):</b> generally 1.5× after 8 hours/day or 40/week, 2× after 12/day, with 7th-consecutive-day rules. <b>Meal & rest (§512, §226.7):</b> a meal period by the 5th hour, paid rest breaks by the hours worked; a missed one owes a premium hour. <b>Wage statements (§226):</b> the pay stub must itemize specific things (hours, rates, gross/net, employer name); missing items are their own violation. <b>Final pay & waiting time (§201–203):</b> final wages are due fast on separation, and late payment can owe a penalty of up to 30 days’ wages. <b>Expense reimbursement (§2802):</b> necessary business costs — mileage, phone, tools — must be repaid. <b>Equal pay (§1197.5):</b> substantially similar work, different pay.'},
          {p:'What powers our product: each of these is proven by <b>records</b> — timecards, pay stubs, schedules, expense logs. That’s why "collect the pay records" is never busywork; it’s the evidence the whole claim rests on. You describe what the records contain; the attorney decides what they establish.'},
        ], cites:[
          {label:'Lab. Code §510 — daily overtime', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=510.'},
          {label:'Lab. Code §§226.7 & 512 — meal & rest periods', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=512.'},
          {label:'Lab. Code §226 — itemized wage statements', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=226.'},
          {label:'Lab. Code §§201–203 — final pay & waiting-time penalty', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=203.'},
          {label:'Lab. Code §2802 — expense reimbursement', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2802.'},
          {label:'Lab. Code §1197.5 — equal pay', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=1197.5.'},
          {label:'CA Labor Commissioner (DLSE) — wage & hour', url:'https://www.dir.ca.gov/dlse/'},
        ]},
      { t:'Retaliation', obj:'Recognize the retaliation family and its shared shape.',
        blocks:[
          {p:'Retaliation is punishing a worker for doing something the law protects. California has several flavors: <b>§1102.5</b> (whistleblower — reporting a suspected legal violation), <b>§98.6</b> (complaining about wages/hours), <b>§6310</b> (raising health & safety), and <b>FEHA §12940(h)</b> (opposing discrimination/harassment).'},
          {p:'They share one shape you can learn once: a <b>protected activity</b> (the report/complaint), the <b>employer’s knowledge</b> of it, an <b>adverse action</b> (fired, cut hours, demoted), and a <b>connection</b> between them — often shown by <b>timing</b>. Notice that last piece: "what happened, and when, relative to the complaint" is a <i>records</i> question, which is exactly what we organize.'},
          {p:'So when a worker says "I complained, and two weeks later they cut my hours," you don’t say "that’s retaliation." You recognize the shape, and help assemble the complaint, the dates, and the action — the record an attorney needs to make that call.'},
        ], cites:[
          {label:'Lab. Code §1102.5 — whistleblower retaliation', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=1102.5.'},
          {label:'Lab. Code §98.6 — wage-complaint retaliation', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=98.6.'},
          {label:'Lab. Code §6310 — health & safety retaliation', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=6310.'},
          {label:'Gov. Code §12940(h) — FEHA retaliation', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=12940.'},
        ]},
      { t:'Discrimination, harassment & leave (FEHA)', obj:'Recognize the FEHA family — the anti-discrimination backbone.',
        blocks:[
          {p:'The Fair Employment and Housing Act (FEHA) is California’s core anti-discrimination law, and it’s broad. <b>Discrimination (§12940(a))</b> covers adverse treatment because of a <b>protected characteristic</b> — race, sex, age (40+), disability, religion, national origin, sexual orientation, pregnancy, and more. <b>Harassment (§12940(j))</b> covers a hostile environment or quid-pro-quo conduct.'},
          {p:'FEHA also carries the <b>disability</b> duties: <b>reasonable accommodation (§12940(m))</b> and the <b>interactive process (§12940(n))</b> — the back-and-forth an employer must engage in about an accommodation. And a family of <b>protected leaves</b> lives alongside it: CFRA (§12945.2), Pregnancy Disability Leave (§12945), pregnancy/lactation accommodation, paid sick leave (§246), with FMLA as a federal overlay.'},
          {p:'The record here is often communications and dates — the accommodation request and the response, the leave asked for and what happened next, statements attributed to decision-makers. You help gather and date those; you never label a characteristic or conclude that bias caused the outcome. That causal call is the attorney’s.'},
        ], cites:[
          {label:'Gov. Code §12940 — FEHA discrimination, harassment & accommodation', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=12940.'},
          {label:'Gov. Code §12945.2 — CFRA family/medical leave', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=12945.2.'},
          {label:'Lab. Code §246 — paid sick leave', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=246.'},
          {label:'California Civil Rights Department (FEHA enforcement)', url:'https://calcivilrights.ca.gov/'},
        ]},
      { t:'Ending the job — termination & constructive discharge', obj:'Recognize wrongful-termination shapes without concluding one occurred.',
        blocks:[
          {p:'California is at-will by default — either side can end the job for almost any reason. The exceptions are what plaintiff firms look at. <b>Wrongful termination in violation of public policy (the "Tameny" claim)</b> is firing someone for a reason the law forbids — e.g., for refusing to break the law, or for exercising a protected right.'},
          {p:'<b>Constructive discharge</b> is when conditions are made so intolerable that a reasonable person would feel forced to quit — legally treated like a firing. It’s a high bar and fact-heavy, which is exactly why the <b>record of the conditions and dates</b> matters so much.'},
          {p:'Your job is unchanged: help the worker lay out what happened and when, with the documents that back it. Whether it clears the legal bar for Tameny or constructive discharge is a judgment for counsel — never a sentence you say.'},
        ], cites:[
          {label:'Lab. Code §2922 — at-will employment presumption', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2922.'},
          {label:'Tameny v. Atlantic Richfield Co. (1980) 27 Cal.3d 167 — wrongful discharge in violation of public policy'},
        ]},
      { t:'The worker’s records rights', obj:'Know what a worker can legally demand — the toolkit our product hands them.',
        blocks:[
          {p:'This lesson is the one that ties employment law directly to what we build. California gives workers the right to <b>get their own records</b>, and the product helps them exercise it.'},
          {p:'<b>Personnel file (§1198.5):</b> a current or former employee can request their personnel records, and the employer must produce them within a set window. <b>Pay records (§226(b)):</b> a right to inspect/copy wage statements. <b>Documents you signed (§432):</b> copies of anything the worker signed. <b>Wage-theft notice (§2810.5):</b> at hire, employers must give written notice of pay rate, payday, and employer details — its absence is itself informative.'},
          {p:'This is why one3seven can <b>draft a records-request letter</b> for a worker: we’re helping them use a right the law already gives them, on their own behalf. Describing that right ("the law lets you request your personnel file") is fine; telling them what the file will prove is not.'},
        ], cites:[
          {label:'Lab. Code §1198.5 — personnel records inspection', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=1198.5.'},
          {label:'Lab. Code §226(b) — wage-record inspection', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=226.'},
          {label:'Lab. Code §432 — copies of signed documents', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=432.'},
          {label:'Lab. Code §2810.5 — wage-theft notice at hire', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2810.5.'},
        ]},
    ],
    quiz:{ intro:'Fluency check — recognize, don’t diagnose', items:[
      { gate:true, q:'A worker describes a classic wage/hour pattern and asks, "So do I have a §510 overtime case?" You:',
        opts:[
          {t:'"Yes, that’s a clear overtime violation."',ok:false},
          {t:'Recognize the shape, and help gather timecards and pay stubs so an attorney can make that call — without saying they have a case.',ok:true},
          {t:'"Probably — you’ll likely win the penalty."',ok:false},
        ], fb:{ ok:'Right — recognize and describe the record; the attorney concludes.', no:'Recognizing the shape is fluency; telling the worker they have a case is UPL. Gather the records; route the conclusion.' } },
      { q:'The four-part shape shared across the retaliation claims is:',
        opts:[
          {t:'Protected activity, employer knowledge, adverse action, and a connection (often timing).',ok:true},
          {t:'Damages, liability, causation, and a jury.',ok:false},
        ], fb:{ ok:'Correct — and each piece is largely a records question, which is what we organize.', no:'It’s: protected activity → employer knowledge → adverse action → connection (timing). Records show each.' } },
      { q:'Why can one3seven draft a records-request letter for a worker?',
        opts:[
          {t:'Because we give legal advice about their case.',ok:false},
          {t:'Because the law (§1198.5, §226(b), §432) already gives the worker that right — we help them use their own.',ok:true},
        ], fb:{ ok:'Right — we’re helping the worker exercise an existing right, not advising on the merits.', no:'It’s the worker’s own statutory right (§1198.5 etc.); we help them use it. We don’t advise on what it proves.' } },
    ]},
  },
  { id:'plaintiff', track:'Domain · Plaintiff-Side Law', title:'Plaintiff-Side Practice', core:true,
    blurb:'How an employment plaintiff’s firm actually works — contingency, intake, the case journey — and exactly where one3seven fits.',
    lessons:[
      { t:'What a plaintiff-side firm is', obj:'Understand the business model that makes everything else make sense.',
        blocks:[
          {p:'Our customer is the <b>plaintiff-side employment firm</b> — the lawyers who represent <b>workers</b>, not employers. Almost all of them work on <b>contingency</b>: they front the time and cost, and only get paid if the case resolves in the worker’s favor, taking a percentage of the recovery.'},
          {p:'That single fact explains their whole world. Because they only get paid when they win, <b>which cases they take</b> is the most consequential decision they make — an accepted case that goes nowhere is months of unpaid work and real out-of-pocket cost. Case <b>selection</b> is existential, not administrative.'},
          {p:'Keep this in your pocket: to this buyer, <b>a cleaner, more complete record de-risks the single scariest decision they make.</b> That’s not a feature pitch — it’s their economics. Everything one3seven sells to a firm connects back to this.'},
        ], cites:[
          {label:'Cal. Rules of Prof. Conduct 1.5 — fees, including contingency', url:'https://www.calbar.ca.gov/Attorneys/Conduct-Discipline/Rules/Rules-of-Professional-Conduct/Current-Rules'},
          {label:'one3seven — internal (customer & business model)'},
        ]},
      { t:'The intake funnel', obj:'See the triage problem one3seven plugs into.',
        blocks:[
          {p:'Firms are flooded with inquiries and can accept only a fraction. So the front of the firm is a <b>funnel</b>: a fast triage that passes on most matters and advances a few. The hard part is that triage is expensive — staff spend hours reconstructing a worker’s scattered story just to decide whether to look closer, much of it on matters they’ll decline.'},
          {p:'That reconstruction is the cost we remove. A worker who arrives with an organized, source-linked record lets the firm screen in minutes instead of a week — and lets them screen <b>more</b> matters without adding staff. We move intake work <b>off the firm’s clock</b> by having the worker assemble the file before they ever reach the firm.'},
          {p:'Say it in their terms: not "we generate leads" (we don’t — that’s the referral line we never cross), but "the worker walks in already organized, so your team spends its first hour deciding, not digging."'},
        ], cites:[
          {label:'Bus. & Prof. Code §6155 — lawyer referral services (the line we don’t cross)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6155.'},
          {label:'one3seven — internal (go-to-market thesis)'},
        ]},
      { t:'The case journey', obj:'Know the arc a matter travels, so you can speak to the whole timeline.',
        blocks:[
          {p:'A matter that gets accepted travels a long arc — often <b>18 to 36 months</b>. Roughly: a <b>demand</b> or filing, then <b>discovery</b> (both sides exchange documents and take depositions), then <b>mediation or settlement talks</b>, and — rarely — <b>trial</b>. Most cases settle; few see a courtroom.'},
          {p:'Two things follow. First, the <b>record matters the entire way</b>, not just at intake — depositions and discovery are where an organized, source-linked file keeps paying off. Second, the worker lives inside a slow, opaque process, which is why reminders and important-dates — hearing dates, exams, records due — are part of what we hold for them.'},
          {p:'You don’t manage litigation and you never calculate a legal deadline. But knowing the arc lets you speak credibly to a firm about where the tool helps beyond the first screen.'},
        ], cites:[
          {label:'California Courts — civil lawsuit basics & timeline', url:'https://selfhelp.courts.ca.gov/civil-lawsuit'},
          {label:'one3seven — internal (case-journey framing)'},
        ]},
      { t:'Case economics & selection', obj:'Understand what makes a firm take a case — and why records decide it.',
        blocks:[
          {p:'Simplifying a complex judgment: firms weigh roughly three things — <b>liability</b> (is the wrong clear?), <b>damages</b> (is there meaningful harm to recover?), and <b>documentation</b> (can it be proven?). A case can have real harm and still be declined because it can’t be <b>shown</b>.'},
          {p:'That third leg is ours. <b>Missing records kill provable cases.</b> A worker who "knows" they were shorted but has no timecards is a much harder yes than one who walks in with the pay stubs and schedules laid out. We don’t judge liability or damages — we make the documentation leg strong, and we show, plainly, what’s present and what’s missing.'},
          {p:'This is where <b>coverage</b> earns its keep: it describes how much of what a claim requires is on file — a structural fact about the record that helps a firm de-risk selection. It is never a score of the case or a prediction of the outcome. Describe the record; the firm judges the matter.'},
        ], cites:[
          {label:'one3seven — internal (case-selection thesis; coverage = describe, never score)'},
          {label:'Bus. & Prof. Code §6125 — why "which cases are strong" is a legal judgment we can’t make', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
        ]},
      { t:'Deadlines & the statute of limitations', obj:'Hold the hardest never-conclude line in this whole course.',
        blocks:[
          {p:'Every claim has a <b>statute of limitations</b> — a deadline to file, after which the right is usually lost. In employment they vary and some are short, and there are administrative steps (like a filing with the civil-rights agency) that gate certain claims. This is real, and it is <b>urgent</b> for workers.'},
          {p:'And it is the single most dangerous place to slip. <b>We never calculate a deadline.</b> Telling a worker "you must file by March 14" is practicing law, full stop — even when we’re sure, even when they’re scared, even when it feels kind. We <b>surface</b> dates that appear on the record or that the worker enters; the <b>attorney</b> does the math on them.'},
          {never:'"Your deadline is…" · "You still have time." · "You’re too late." · "File by [date]."'},
          {say:'Deadlines in these cases can be short, so getting your record in front of an attorney soon matters — I can’t calculate the date, but a lawyer can, quickly.'},
        ], cites:[
          {label:'Code Civ. Proc. §335.1 — two-year limitations period', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CCP&sectionNum=335.1.'},
          {label:'Code Civ. Proc. §338 — three-year limitations (liability created by statute)', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CCP&sectionNum=338.'},
          {label:'Gov. Code §12960 — FEHA administrative complaint window', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=GOV&sectionNum=12960.'},
          {label:'Bus. & Prof. Code §6125 — calculating a deadline is the practice of law', url:'https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=6125.'},
        ]},
      { t:'Where one3seven fits', obj:'Tie the whole course into one sentence you can say on a call.',
        blocks:[
          {p:'Put it together. A contingency firm lives or dies on case selection; selection turns on documentation; documentation is exactly what a scattered worker lacks and what we assemble. one3seven is <b>case-selection infrastructure</b> — not a lead source, not a scorer, not a referral service.'},
          {p:'The worker owns and chooses; we organize and cite; the attorney evaluates and concludes. Every part of the plaintiff-side world you just learned points back to that division of labor — and to why staying strictly on the "organize" side of it is what makes a compliant firm able to hire us at all.'},
          {p:'One sentence for a call: <b>"You screen the case, not the chaos — the worker walks in organized and source-linked, so your team’s first hour is a decision, not a reconstruction."</b>'},
        ], cites:[

var synth=window.speechSynthesis;
if(synth&&typeof synth.onvoiceschanged!=='undefined'){synth.onvoiceschanged=function(){};}
function pickVoice(){
  if(!synth)return null; var vs=synth.getVoices()||[];
  var en=vs.filter(function(v){return /^en(-|_|$)/i.test(v.lang);});
  // Prefer high-quality neural voices; fall back down the list. (Zira/David = the old robotic ones — avoided.)
  var pref=[/natural/i,/neural/i,/google us english/i,/samantha/i,/(aria|jenny|libby|nova|serena|allison)/i,/google/i];
  for(var i=0;i<pref.length;i++){ var m=en.find(function(v){return pref[i].test(v.name);}); if(m)return m; }
  return en[0]||vs[0]||null;
}
function stripTags(s){var d=document.createElement('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim();}
function lessonSpeech(l){ var parts=[l.t+'.', stripTags(l.obj)];
  l.blocks.forEach(function(b){ if(b.p)parts.push(stripTags(b.p)); if(b.say)parts.push('Here is what to say. '+stripTags(b.say)); if(b.never)parts.push('Never say the following. '+stripTags(b.never)); });
  return parts.join(' '); }
function stopSpeech(){ if(synth)synth.cancel(); }
function toggleListen(l,btn){
  if(!synth){btn.textContent='Read-aloud not supported';return;}
  if(synth.speaking&&!synth.paused){ synth.pause(); btn.classList.remove('playing'); btn.textContent='▶ Resume'; return; }
  if(synth.paused){ synth.resume(); btn.classList.add('playing'); btn.textContent='⏸ Pause'; return; }
  synth.cancel();
  var text=lessonSpeech(l), v=pickVoice();
  var chunks=text.match(/[^.!?]+[.!?]+/g)||[text];
  chunks.forEach(function(ch,i){ var u=new SpeechSynthesisUtterance(ch.trim()); if(v)u.voice=v; u.rate=0.98; u.pitch=1;
    if(i===chunks.length-1)u.onend=function(){ btn.classList.remove('playing'); btn.textContent='🔊 Listen'; }; synth.speak(u); });
  btn.classList.add('playing'); btn.textContent='⏸ Pause';
}
