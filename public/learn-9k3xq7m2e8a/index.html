function saveCourseFromForm(existingId, isNew){
  var msg=document.getElementById('ed-msg');
  var title=document.getElementById('ed-title').value.trim();
  if(!title){ if(msg){msg.style.color='var(--accent)'; msg.textContent='Give the course a title first.';} return; }
  var id = existingId || slugify(title) || ('course-'+(''+Math.random()).slice(2,8));
  var lessons=[];
  document.querySelectorAll('#ed-lessons .lesson-b').forEach(function(b){
    var t=b.querySelector('.l-t').value.trim(), obj=b.querySelector('.l-obj').value.trim(), body=b.querySelector('.l-body').value;
    if(!t && !body.trim()) return; lessons.push({ t:t, obj:obj, blocks:parseBlocks(body) });
  });
  var items=[];
  document.querySelectorAll('#ed-questions .q-b').forEach(function(b){
    var q=b.querySelector('.q-text').value.trim(); if(!q)return;
    var oks=b.querySelectorAll('.q-ok'), texts=b.querySelectorAll('.q-opt'), opts=[];
    texts.forEach(function(t,i){ var v=t.value.trim(); if(v) opts.push({t:v, ok:!!(oks[i]&&oks[i].checked)}); });
    if(opts.length<2) return; if(!opts.some(function(o){return o.ok;})) opts[0].ok=true;
    var typ=b.querySelector('.q-type').value;
    var item={ q:q, opts:opts, fb:{ ok:b.querySelector('.q-fbok').value.trim(), no:b.querySelector('.q-fbno').value.trim() } };
    if(typ==='apply')item.apply=true; if(typ==='gate')item.gate=true; items.push(item);
  });
  if(!lessons.length){ if(msg){msg.style.color='var(--accent)'; msg.textContent='Add at least one lesson.';} return; }
  var course={ id:id, track:document.getElementById('ed-track').value.trim()||'Core', title:title, blurb:document.getElementById('ed-blurb').value.trim(), core:document.getElementById('ed-core').checked, lessons:lessons, quiz:{ intro:document.getElementById('ed-qintro').value.trim()||'Check your understanding', items:items } };
  if(!sb){ if(msg){msg.style.color='var(--accent)'; msg.textContent='Offline — cannot save.';} return; }
  if(msg){msg.style.color='var(--sage-deep)'; msg.textContent='Saving…';}
  sb.from('academy_courses').upsert({ id:course.id, track:course.track, title:course.title, blurb:course.blurb, core:course.core, data:{lessons:course.lessons, quiz:course.quiz}, updated_at:new Date().toISOString() },{onConflict:'id'}).then(function(r){
    if(r.error){ if(msg){msg.style.color='var(--accent)'; msg.textContent='Error: '+r.error.message;} return; }
    var ix=ACADEMY.findIndex(function(x){return x.id===course.id;}); if(ix>=0)ACADEMY[ix]=course; else ACADEMY.push(course);
    if(msg){msg.style.color='var(--sage-deep)'; msg.textContent='Saved ✓';} setTimeout(renderAdmin,600);
  },function(){ if(msg){msg.style.color='var(--accent)'; msg.textContent='Could not save — try again.';} });
}

function credHash(seed){ var h=5381; for(var i=0;i<seed.length;i++){ h=((h<<5)+h+seed.charCodeAt(i))>>>0; } return h.toString(36).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); }

  if(!id){ var code=credHash((name||'anon')+level+date); id='O37-FND-'+(code+'000000').slice(0,6); set(idKey,id); }
  return {name:name,id:id,date:date};
}

  stopSpeech();
  var atQuiz = idx>=c.lessons.length;
  var h='<div class="crumbs"><a id="bk">‹ Academy</a> / '+c.title+'</div>';
  h+='<div class="lessonwrap"><div class="rail"><div class="rt">'+c.title+'</div>';
  c.lessons.forEach(function(l,i){
    h+='<button data-i="'+i+'" class="lz '+(i===idx&&!atQuiz?'active':'')+' '+(lessonDone(cid,i)?'done':'')+'"><span class="dot"></span><span>'+(i+1)+'. '+l.t+'</span></button>';
  });
  h+='<button data-i="'+c.lessons.length+'" class="lz '+(atQuiz?'active':'')+' '+(get('q:'+cid)==='pass'?'done':'')+'"><span class="dot"></span><span>✎ Quiz</span></button>';
  h+='</div><div class="lesson" id="lz-body"></div></div>';
  view.innerHTML=h;
  document.getElementById('bk').addEventListener('click',renderHome);
  document.querySelectorAll('.rail .lz').forEach(function(b){b.addEventListener('click',function(){openCourse(cid,parseInt(b.getAttribute('data-i')));});});
  var body=document.getElementById('lz-body');
  if(atQuiz){ renderQuiz(c,body); window.scrollTo(0,0); return; }
  var l=c.lessons[idx]; var pctL=Math.round((idx+1)/c.lessons.length*100);
  var hb='<div class="lprog"><span class="lstep">Lesson '+(idx+1)+' of '+c.lessons.length+'</span><div class="lbar"><i style="width:'+pctL+'%"></i></div></div>';
  hb+='<h2>'+l.t+'</h2><div class="obj">'+l.obj+'</div><button class="listen" id="listen">🔊 Listen to this lesson</button>';
  l.blocks.forEach(function(b){
    if(b.p)hb+='<p>'+b.p+'</p>';
    if(b.say)hb+='<div class="say">'+b.say+'</div>';
    if(b.never)hb+='<div class="never">'+b.never+'</div>';
  });
  if(l.cites && l.cites.length){
    hb+='<div class="cites"><div class="cites-h">Sources</div><ul>';
    l.cites.forEach(function(c){
      hb+= c.url ? '<li><a href="'+c.url+'" target="_blank" rel="noopener noreferrer">'+c.label+'</a></li>'
                 : '<li><span class="internal">'+c.label+'</span></li>';
    });
    hb+='</ul></div>';
  }
  hb+='<div class="lnav">';
  hb+= idx>0 ? '<button class="btn ghost" id="prev">‹ Previous</button>' : '<span></span>';
  var last = idx===c.lessons.length-1;
  hb+='<button class="btn" id="next">'+(lessonDone(cid,idx)?(last?'Go to quiz ›':'Next ›'):'Mark complete ›')+'</button>';
  hb+='</div>';
  body.innerHTML=hb;
  document.getElementById('listen').addEventListener('click',function(){ toggleListen(l,this); });
  if(idx>0)document.getElementById('prev').addEventListener('click',function(){openCourse(cid,idx-1);});
  document.getElementById('next').addEventListener('click',function(){ set('l:'+cid+':'+idx,'1'); openCourse(cid,idx+1); });
  window.scrollTo(0,0);
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(c,body){
  var q=c.quiz; var picks={};
  function draw(){
    var h='<div class="quiz"><div class="qi">'+q.intro+(c.quiz.items.some(function(it){return it.gate;})?' · must pass':'')+'</div>';
    q.items.forEach(function(it,qi){
      h+='<div class="qq">'+(it.gate?'<span class="tag">DOCTRINE GATE</span>':(it.apply?'<span class="tag">APPLY</span>':''))+it.q+'</div><div class="opts">';
      it.opts.forEach(function(o,oi){
        var cls='opt'; if(picks[qi]!==undefined){ if(o.ok)cls+=' right'; else if(picks[qi]===oi)cls+=' wrong'; } else if(picks[qi]===oi)cls+=' pick';
        h+='<button class="'+cls+'" data-q="'+qi+'" data-o="'+oi+'">'+o.t+'</button>';
      });
      h+='</div>';
      if(picks[qi]!==undefined){ var ok=it.opts[picks[qi]].ok; h+='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✓ ':'✗ ')+(ok?it.fb.ok:it.fb.no)+'</div>'; }
      h+='</div>';
    });
    var answered=q.items.every(function(_,qi){return picks[qi]!==undefined;});
    var allright=q.items.every(function(it,qi){return picks[qi]!==undefined&&it.opts[picks[qi]].ok;});
    if(answered){
      if(allright){ set('q:'+c.id,'pass');
        h+='<div class="fb ok" style="margin-top:16px"><b>Passed.</b> You’ve completed <b>'+c.title+'</b>.</div>';
        h+='<div class="demo"><b>Demonstrate (Stage 3):</b> a founder will have you handle this live before it counts toward hiring. Knowing it here is step one; doing it under pressure is the real gate.</div>';
        h+='<div class="lnav"><span></span><button class="btn orange" id="fin">Finish ›</button></div>';
      } else {
        h+='<div class="fb no" style="margin-top:16px">Review the red answers, then try those questions again — the gate needs every answer right.</div>';
        h+='<div class="lnav"><span></span><button class="btn ghost" id="retry">Try again</button></div>';
      }
    }
    h+='</div>';
    body.innerHTML=h;
    body.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){ var qi=b.getAttribute('data-q'); if(picks[qi]!==undefined)return; picks[qi]=parseInt(b.getAttribute('data-o')); draw(); });});
    var fin=document.getElementById('fin'); if(fin)fin.addEventListener('click',renderHome);
    var rt=document.getElementById('retry'); if(rt)rt.addEventListener('click',function(){ picks={}; draw(); });
  }
  draw();
}
